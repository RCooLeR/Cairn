version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /src
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      go:
        patterns: ["*"]
      go-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      frontend:
        patterns: ["*"]
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /build/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      containers:
        patterns: ["*"]
      containers-security:
        applies-to: security-updates
        patterns: ["*"]
