version: '3'

vars:
  APP_NAME: "cairn"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GARBLE_VERSION: "v0.17.0"
  GARBLE_PACKAGE: "mvdan.cc/garble@{{.GARBLE_VERSION}}"
  GARBLE_INSTALL_HINT: "garble is required for obfuscated builds. Install it with: go install {{.GARBLE_PACKAGE}} (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GOLANGCI_LINT_PACKAGE: "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}"
includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  env:check:
    summary: Verifies pinned local toolchain versions
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-toolchain.ps1
        platforms: [windows]
      - cmd: pwsh -NoProfile -File scripts/check-toolchain.ps1
        platforms: [linux, darwin]

  assets:sync:
    summary: Syncs Cairn source artwork into Wails build inputs
    cmds:
      - task: common:sync:assets

  frontend:install:
    summary: Installs the exact frontend dependency lock
    dir: frontend
    cmds:
      - '{{if eq .PACKAGE_MANAGER "npm"}}npm ci{{else}}{{.PACKAGE_MANAGER}} install{{end}}'

  frontend:lint:
    summary: Runs frontend lint
    dir: frontend
    cmds:
      - "{{.PACKAGE_MANAGER}} run lint"

  frontend:format:check:
    summary: Checks frontend formatting
    dir: frontend
    cmds:
      - "{{.PACKAGE_MANAGER}} run format:check"

  frontend:test:
    summary: Runs frontend unit tests
    dir: frontend
    cmds:
      - "{{.PACKAGE_MANAGER}} test"

  frontend:build:
    summary: Builds the frontend
    dir: frontend
    cmds:
      - "{{.PACKAGE_MANAGER}} run build"

  frontend:ladle:build:
    summary: Builds frontend component stories
    dir: frontend
    cmds:
      - "{{.PACKAGE_MANAGER}} run ladle:build"

  go:test:
    summary: Runs Go unit tests
    cmds:
      - go test ./...

  go:lint:
    summary: Runs Go static checks
    cmds:
      - go vet -unsafeptr=false ./...
      - go run {{.GOLANGCI_LINT_PACKAGE}} run --timeout=5m

  go:vuln:
    summary: Runs Go vulnerability scanning
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-govulncheck.ps1
        platforms: [windows]
      - cmd: pwsh -NoProfile -File scripts/run-govulncheck.ps1
        platforms: [linux, darwin]

  security:server-containment:
    summary: Verifies that unsupported Wails server mode remains quarantined
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-server-mode-containment.ps1
        platforms: [windows]
      - cmd: pwsh -NoProfile -File scripts/check-server-mode-containment.ps1
        platforms: [linux, darwin]

  lint:
    summary: Runs all linters
    cmds:
      - task: frontend:lint
      - task: frontend:format:check
      - task: go:lint

  test:
    summary: Runs all unit tests
    cmds:
      - task: frontend:test
      - task: go:test

  ci:
    summary: Runs the Phase 0.1 CI checks locally
    cmds:
      - task: assets:sync
      - task: frontend:lint
      - task: frontend:format:check
      - task: frontend:test
      - task: frontend:ladle:build
      - task: frontend:build
      - task: go:lint
      - task: go:vuln
      - task: go:test
      - task: security:server-containment

  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker
        vars:
          GARBLE_VERSION:
            ref: .GARBLE_VERSION
